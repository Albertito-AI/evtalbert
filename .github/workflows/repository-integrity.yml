name: EVT repository integrity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Inspect the bundled test contract
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('evtalbert_v0_1_0.zip') as archive:
              for name in ('pyproject.toml', 'tests/test_smoke.py'):
                  print(f'===== {name} =====')
                  print(archive.read(name).decode('utf-8'))
          PY
      - name: Validate documents and the preserved legacy archive
        run: python scripts/validate_legacy_archive.py
