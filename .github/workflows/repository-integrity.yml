name: EVT repository integrity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tools and the source package
        run: |
          python -m pip install 'setuptools==84.2.1' 'wheel==0.48.0'
          python -m pip install --no-build-isolation --no-deps .
      - name: Run source regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate source layout, licence and tracked files
        run: python scripts/validate_source.py
      - name: Replay the committed synthetic demonstration
        run: python scripts/readme_demo.py --check
